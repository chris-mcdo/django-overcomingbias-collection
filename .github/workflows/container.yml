name: container

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build reviewed published packages
        # Build the approved published dependency versions.
        run: |
          docker build --tag collection-review \
            --build-arg 'OBAPI_REQUIREMENT=django-overcomingbias-api==0.7.0' \
            --build-arg 'OBPAGES_REQUIREMENT=django-overcomingbias-pages==0.8.0' \
            --build-arg COLLECTION_VERSION=0.8.0rc1 .
      - name: Offline web and worker startup checks
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,size=64m \
            --mount type=bind,src="$PWD/container/smoke.py",dst=/smoke.py,readonly \
            --entrypoint /opt/obcollection/venv/bin/python collection-review /smoke.py
