name: release

on:
  push:
    tags:
      - 'v?[0-9]+\.[0-9]+\.[0-9]+*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Require reviewed dependency versions
        env:
          OBAPI_VERSION: ${{ vars.OBAPI_VERSION }}
          OBPAGES_VERSION: ${{ vars.OBPAGES_VERSION }}
        run: |
          test -n "$OBAPI_VERSION" && test -n "$OBPAGES_VERSION"
          python - <<'PY'
          import os, re
          for name in ['OBAPI_VERSION', 'OBPAGES_VERSION']:
              if not re.fullmatch(r'[0-9]+(?:\.[0-9]+)*(?:(?:a|b|rc)[0-9]+|\.post[0-9]+)?', os.environ[name]):
                  raise SystemExit('Set an explicit reviewed package version: ' + name)
          PY

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=pep440,pattern={{major}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{version}},priority=1000

      - name: Verify full release version before building
        env:
          SELECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python - <<'PY'
          import os
          expected = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          actual = os.environ['SELECTED_VERSION']
          if actual != expected:
              raise SystemExit(f'Release version mismatch: expected {expected}, got {actual}')
          PY

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          build-args: |
            OBAPI_REQUIREMENT=django-overcomingbias-api==${{ vars.OBAPI_VERSION }}
            OBPAGES_REQUIREMENT=django-overcomingbias-pages==${{ vars.OBPAGES_VERSION }}
            COLLECTION_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
