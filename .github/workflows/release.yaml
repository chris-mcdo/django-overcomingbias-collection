name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate reviewed application manifest
        run: python container/application.py validate

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=pep440,pattern={{major}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{version}},priority=1000

      - name: Verify full release version before building
        env:
          SELECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python - <<'PY'
          import os
          expected = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          actual = os.environ['SELECTED_VERSION']
          import json
          source_version = json.load(open('container/application.json'))['collection_version']
          if actual != expected or source_version != expected:
              raise SystemExit(f'Release version mismatch: expected {expected}, got {actual}')
          PY

      - name: Build reviewed manifest and test the image before publication
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash container/build-application.sh "$IMAGE" "$VERSION"

      - name: Publish tested source release image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag "$IMAGE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"
